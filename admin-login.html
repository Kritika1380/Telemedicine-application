<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Nabha Connect</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <i class="fas fa-heartbeat"></i>
                    <span>Nabha Connect</span>
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#services">Services</a></li>
                    <li><a href="index.html#about">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="login-section">
        <div class="login-container">
            <div class="login-card admin-login">
                <div class="login-header">
                    <div class="login-icon admin">
                        <i class="fas fa-user-shield"></i>
                    </div>
                    <h2>Admin Login</h2>
                    <p>System administration portal</p>
                </div>
                <form id="adminLoginForm" class="login-form">
                    <div class="form-group">
                        <label for="adminUsername">
                            <i class="fas fa-user-shield"></i>
                            Admin Username
                        </label>
                        <input type="text" id="adminUsername" name="username" placeholder="Enter admin username" required>
                    </div>
                    <div class="form-group">
                        <label for="adminPassword">
                            <i class="fas fa-lock"></i>
                            Password
                        </label>
                        <div class="password-input">
                            <input type="password" id="adminPassword" name="password" placeholder="Enter your password" required>
                            <span class="toggle-password" onclick="togglePassword('adminPassword')">
                                <i class="fas fa-eye"></i>
                            </span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="adminCode">
                            <i class="fas fa-key"></i>
                            Security Code
                        </label>
                        <input type="text" id="adminCode" name="securityCode" placeholder="Enter security code" required>
                    </div>
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>Remember this device</span>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
                <div class="login-footer">
                    <div class="other-logins">
                        <span>Other portals:</span>
                        <a href="user-login.html">Patient</a> | 
                        <a href="doctor-login.html">Doctor</a>
                    </div>
                </div>
            </div>
            <div class="login-info">
                <div class="info-card">
                    <i class="fas fa-database"></i>
                    <h3>System Control</h3>
                    <p>Manage all platform operations and users</p>
                </div>
                <div class="info-card">
                    <i class="fas fa-users-cog"></i>
                    <h3>User Management</h3>
                    <p>Oversee doctors, patients, and appointments</p>
                </div>
                <div class="info-card">
                    <i class="fas fa-chart-bar"></i>
                    <h3>Analytics</h3>
                    <p>Monitor platform statistics and performance</p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
